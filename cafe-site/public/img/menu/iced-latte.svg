<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="islBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#261b17"/>
      <stop offset="100%" stop-color="#100a08"/>
    </radialGradient>
    <linearGradient id="condensedM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf2db"/>
      <stop offset="100%" stop-color="#fae2b8"/>
    </linearGradient>
    <linearGradient id="milkMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbf8f3"/>
      <stop offset="100%" stop-color="#ede3d5"/>
    </linearGradient>
    <linearGradient id="espressoTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b1d0e"/>
      <stop offset="100%" stop-color="#69371d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#islBg)"/>

  <!-- Glass Shadow -->
  <ellipse cx="400" cy="510" rx="130" ry="24" fill="#000" opacity="0.55"/>

  <!-- Glass Cup -->
  <g>
    <!-- Condensed milk base -->
    <path d="M 336 440 L 344 485 Q 400 496 456 485 L 464 440 Z" fill="url(#condensedM)"/>
    <!-- Fresh Milk Middle -->
    <path d="M 326 310 L 336 440 Q 400 448 464 440 L 474 310 Z" fill="url(#milkMid)"/>
    <!-- Espresso Pour Top with swirl tentacles dripping down -->
    <path d="M 318 200 L 326 310 Q 360 320 375 350 Q 390 320 420 360 Q 445 320 474 310 L 482 200 Z" fill="url(#espressoTop)"/>

    <!-- Ice cubes inside glass -->
    <rect x="350" y="240" width="50" height="50" rx="8" transform="rotate(15, 375, 265)" fill="#fff" opacity="0.3" stroke="#fff" stroke-width="1.5"/>
    <rect x="390" y="320" width="48" height="48" rx="8" transform="rotate(-10, 414, 344)" fill="#fff" opacity="0.25" stroke="#fff" stroke-width="1.5"/>

    <!-- Glass Rim & Outline -->
    <path d="M 315 190 L 344 485 Q 400 498 456 485 L 485 190" fill="none" stroke="#fff" stroke-width="4.5" stroke-opacity="0.4"/>
    <ellipse cx="400" cy="190" rx="85" ry="16" fill="none" stroke="#fff" stroke-width="3" stroke-opacity="0.7"/>

    <!-- Glass straw -->
    <rect x="420" y="90" width="12" height="400" rx="6" transform="rotate(-12, 420, 200)" fill="#baa48b" opacity="0.4" stroke="#fff" stroke-width="1.5"/>
  </g>

  <rect x="35" y="35" rx="8" ry="8" width="145" height="34" fill="#b8743a" opacity="0.95"/>
  <text x="107" y="58" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">سبانش لاتيه بارد</text>
</svg>