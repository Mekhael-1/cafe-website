<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="g3bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a1e19"/>
      <stop offset="100%" stop-color="#0a0503"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#g3bg)"/>
  
  <!-- Barista Hands (Silhouettes with warm highlights) -->
  <!-- Metal Milk Steaming Pitcher -->
  <g transform="translate(480, 150) rotate(-45)">
    <!-- Stainless Pitcher Body -->
    <path d="M 0 0 L 180 0 L 150 200 L 20 200 Z" fill="#b0bec5"/>
    <path d="M 20 0 L 160 0 L 140 200 L 30 200 Z" fill="#cfd8dc"/>
    <!-- Spout pouring microfoam stream -->
    <polygon points="-10,0 20,-30 20,30" fill="#90a4ae"/>
    <path d="M 160 30 C 230 40 230 160 140 170" fill="none" stroke="#78909c" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Pouring Milk stream into cup -->
  <path d="M 430 220 Q 395 300 400 350" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <path d="M 430 220 Q 395 300 400 350" fill="none" stroke="#fff9eb" stroke-width="8" stroke-linecap="round"/>

  <!-- Tilted Cup held in hand -->
  <g transform="translate(370, 390) rotate(18)">
    <ellipse cx="0" cy="0" rx="140" ry="70" fill="#1b2e27"/>
    <ellipse cx="0" cy="-5" rx="130" ry="62" fill="#fff"/>
    <ellipse cx="0" cy="-5" rx="120" ry="54" fill="#69371d"/>
    <!-- Latte Art forming in center -->
    <path d="M -40 -15 C -20 -40 20 -40 40 -15 C 30 10 0 35 0 35 C 0 35 -30 10 -40 -15 Z" fill="#fff"/>
    <circle cx="0" cy="-20" r="14" fill="#fff"/>
  </g>
</svg>