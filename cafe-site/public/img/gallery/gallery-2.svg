<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sunSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde0b2"/>
      <stop offset="60%" stop-color="#eed5b8"/>
      <stop offset="100%" stop-color="#b89370"/>
    </linearGradient>
    <filter id="gbl"><feGaussianBlur stdDeviation="15"/></filter>
  </defs>
  <rect width="800" height="600" fill="url(#sunSky)"/>

  <!-- Morning Sun Orb -->
  <circle cx="580" cy="160" r="110" fill="#fff5dd" opacity="0.7" filter="url(#gbl)"/>

  <!-- Terrace Pergola Wooden Beams -->
  <rect x="0" y="20" width="800" height="30" fill="#382117"/>
  <rect x="120" y="50" width="30" height="200" fill="#4d3023"/>
  <rect x="650" y="50" width="30" height="200" fill="#4d3023"/>
  <line x1="0" y1="80" x2="800" y2="80" stroke="#2c180f" stroke-width="15"/>
  <line x1="0" y1="130" x2="800" y2="130" stroke="#2c180f" stroke-width="15"/>

  <!-- Hanging lush green plants -->
  <path d="M 180 50 Q 170 140 190 200 Q 210 130 180 50" fill="#406943"/>
  <path d="M 320 50 Q 300 160 340 230 Q 350 150 320 50" fill="#588b5c"/>
  <path d="M 520 50 Q 550 150 510 220 Q 490 140 520 50" fill="#3b613e"/>

  <!-- Cafe Bistro Table and Cup -->
  <ellipse cx="400" cy="520" rx="320" ry="120" fill="#2d1d17"/>
  <ellipse cx="400" cy="510" rx="300" ry="105" fill="#e8ded1"/>
  <!-- Cup on table in the morning light -->
  <ellipse cx="400" cy="460" rx="70" ry="24" fill="#a48c6f"/>
  <ellipse cx="400" cy="455" rx="60" ry="18" fill="#fff"/>
  <ellipse cx="400" cy="455" rx="50" ry="14" fill="#69371d"/>
  <!-- Croissant plate next to cup -->
  <ellipse cx="560" cy="480" rx="60" ry="22" fill="#d2c4b0"/>
  <path d="M 530 480 Q 560 460 590 480 Q 560 500 530 480" fill="#d68426"/>
</svg>