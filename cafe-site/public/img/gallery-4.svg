<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="g4bg" cx="30%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#3c261b"/>
      <stop offset="100%" stop-color="#110804"/>
    </radialGradient>
    <filter id="glowLamp"><feGaussianBlur stdDeviation="25"/></filter>
  </defs>
  <rect width="800" height="600" fill="url(#g4bg)"/>

  <!-- Warm Reading Desk Lamp Glow -->
  <circle cx="280" cy="220" r="140" fill="#fbc531" opacity="0.35" filter="url(#glowLamp)"/>
  
  <!-- Desk Lamp -->
  <path d="M 280 180 L 220 280" stroke="#baa48b" stroke-width="8" stroke-linecap="round"/>
  <path d="M 220 280 L 240 440" stroke="#baa48b" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="280" cy="180" rx="35" ry="22" fill="#2d1c13"/>
  <ellipse cx="280" cy="183" rx="30" ry="18" fill="#ffd166"/>

  <!-- Wooden Bookshelf in Background -->
  <rect x="460" y="80" width="300" height="20" fill="#4d3023"/>
  <!-- Books standing on shelf -->
  <rect x="480" y="20" width="22" height="60" fill="#c65d3b"/>
  <rect x="506" y="10" width="28" height="70" fill="#7c8f6b"/>
  <rect x="538" y="25" width="20" height="55" fill="#b8743a"/>
  <rect x="562" y="15" width="32" height="65" fill="#395b64"/>
  <rect x="598" y="30" width="26" height="50" fill="#a55233"/>

  <!-- Oak Desk Surface -->
  <rect x="0" y="440" width="800" height="160" fill="#251610"/>
  <line x1="0" y1="445" x2="800" y2="445" stroke="#fff" stroke-opacity="0.1" stroke-width="3"/>

  <!-- Open Notebook and Cup of Coffee -->
  <polygon points="340,470 480,455 620,470 600,560 480,540 360,560" fill="#faf5ee"/>
  <line x1="480" y1="455" x2="480" y2="540" stroke="#d5c7b5" stroke-width="3"/>
  <!-- Pen -->
  <rect x="310" y="490" width="8" height="60" rx="3" transform="rotate(-30, 310, 490)" fill="#c65d3b"/>
  
  <!-- Steaming Cup -->
  <ellipse cx="680" cy="490" rx="45" ry="18" fill="#e2d6c3"/>
  <ellipse cx="680" cy="486" rx="38" ry="14" fill="#3c1d0e"/>
</svg>